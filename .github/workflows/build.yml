name: 构建

on:
  workflow_dispatch:
    inputs:
      sync_upstream_first:
        description: '构建前先同步上游 Tags？'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================
  # 构建任务
  # ============================================================
  build:
    runs-on: macos-latest
    
    steps:
      # --------------------------------------------------------
      # 检出代码
      # --------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 同步上游 Tags（可选）
      # --------------------------------------------------------
      - name: 同步上游 Tags
        if: github.event.inputs.sync_upstream_first == 'true'
        run: |
          echo "=== 同步上游 Tags ==="
          git remote add upstream https://github.com/zeroxjf/cyanide-ios.git
          git fetch upstream --tags
          
          # 获取上游最新的 5 个正式版本
          git ls-remote --tags upstream | \
            awk -F'/' '{print $3}' | \
            sed 's/\^{}//' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -Vr | \
            head -5 > keep.txt
          
          # 保留 nightly tag
          if git rev-parse -q --verify "refs/tags/nightly" >/dev/null; then
            echo "nightly" >> keep.txt
          fi
          
          echo "=== 将保留的 Tags ==="
          cat keep.txt
          
          # 删除不在保留列表中的 tags
          for tag in $(git tag); do
            if ! grep -qxF "$tag" keep.txt; then
              echo "删除: $tag"
              git tag -d "$tag"
              git push origin --delete "$tag" || true
            fi
          done
          
          # 添加缺失的正式版本 tags
          for tag in $(grep -E '^v[0-9]' keep.txt); do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "添加: $tag"
              git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            fi
          done
          
          # 推送所有保留的 tags
          git push origin --tags --force
          
          echo "=== 同步完成 ==="
          git tag --sort=-v:refname

      # --------------------------------------------------------
      # 配置 Xcode
      # --------------------------------------------------------
      - name: 配置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # --------------------------------------------------------
      # 显示 Xcode 版本
      # --------------------------------------------------------
      - name: 显示 Xcode 版本
        run: xcodebuild -version

      # --------------------------------------------------------
      # 生成更新日志
      # --------------------------------------------------------
      - name: 生成更新日志
        run: |
          brew install bash
          chmod +x scripts/gen-changelog.sh
          /opt/homebrew/bin/bash scripts/gen-changelog.sh

      # --------------------------------------------------------
      # 自动生成私有头文件
      # --------------------------------------------------------
      - name: 自动生成私有头文件
        run: |
          chmod +x scripts/gen_private_headers.sh
          scripts/gen_private_headers.sh

      # --------------------------------------------------------
      # 构建 IPA
      # --------------------------------------------------------
      - name: 构建 IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      # --------------------------------------------------------
      # 上传 IPA
      # --------------------------------------------------------
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/Cyanide-*.ipa

  # ============================================================
  # Release 任务
  # ============================================================
  release:
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      # --------------------------------------------------------
      # 检出代码
      # --------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 下载 IPA
      # --------------------------------------------------------
      - name: 下载 IPA
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      # --------------------------------------------------------
      # 获取版本信息
      # --------------------------------------------------------
      - name: 获取版本信息
        id: version
        run: |
          IPA=$(ls build/Cyanide-*.ipa | head -1)
          VERSION=$(echo "$IPA" | sed -E 's/.*Cyanide-([0-9.]+)\.ipa/\1/')
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9.]+$' | head -1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="v${VERSION}"
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # --------------------------------------------------------
      # 获取提交记录
      # --------------------------------------------------------
      - name: 获取提交记录
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)" | head -20)
          [ -z "$COMMITS" ] && COMMITS="最近 12 小时没有新提交"
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # --------------------------------------------------------
      # 写入发布说明
      # --------------------------------------------------------
      - name: 写入发布说明
        run: |
          cat <<EOF > release_notes.txt
          Cyanide 每日构建 - ${{ steps.version.outputs.tag }}
          
          最近 12 小时提交：
          
          ${COMMITS}
          EOF

      # --------------------------------------------------------
      # 更新 Release
      # --------------------------------------------------------
      - name: 更新 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --notes "初始每日构建" --target main
          gh release edit nightly --title "${{ steps.version.outputs.tag }}" --notes-file release_notes.txt
          gh release upload nightly "${{ steps.version.outputs.ipa }}" --clobber

name: 构建

on:
  workflow_dispatch:
    inputs:
      sync_upstream_first:
        description: '构建前先同步上游 Tags？'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 构建任务
  build:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 可选：同步上游 Tags
      - name: 同步上游 Tags（勾选时执行）
        if: github.event.inputs.sync_upstream_first == 'true'
        run: |
          echo "=== 同步上游 Tags ==="
          git remote add upstream https://github.com/zeroxjf/cyanide-ios.git
          git fetch upstream --tags
          
          # 获取上游最新的 5 个正式版本 tags
          git ls-remote --tags upstream | \
            awk -F'/' '{print $3}' | \
            sed 's/\^{}//' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -Vr | \
            head -5 > keep.txt
          
          # 把 nightly 加入保留列表（如果存在）
          if git rev-parse -q --verify "refs/tags/nightly" >/dev/null; then
            echo "nightly" >> keep.txt
          fi
          
          echo "=== 将保留的 Tags ==="
          cat keep.txt
          
          # 删除本地所有不在保留列表中的 tags
          for tag in $(git tag); do
            if ! grep -qxF "$tag" keep.txt; then
              echo "删除: $tag"
              git tag -d "$tag"
              git push origin --delete "$tag" || true
            fi
          done
          
          # 添加保留列表中本地没有的正式版本 tags
          for tag in $(grep -E '^v[0-9]' keep.txt); do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "添加: $tag"
              git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            fi
          done
          
          # 推送所有保留的 tags
          git push origin --tags --force
          
          echo "=== 同步完成 ==="
          git tag --sort=-v:refname

      - name: 配置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 生成更新日志
        run: |
          brew install bash
          chmod +x scripts/gen-changelog.sh
          /opt/homebrew/bin/bash scripts/gen-changelog.sh

      # ============================================
      # 精确自动识别并生成私有头文件
      # ============================================
      - name: 精确生成私有头文件
        run: |
          mkdir -p Cyanide/tweaks/private
          
          # 扫描所有需要的私有头文件
          echo "=== 扫描需要的私有头文件 ==="
          grep -rh '#import "tweaks/private/' Cyanide/ --include="*.m" --include="*.h" 2>/dev/null | \
            sed -E 's/.*#import "tweaks\/private\/([^"]+\.h)".*/\1/' | \
            sort -u > required_headers.txt
          
          if [ ! -s required_headers.txt ]; then
            echo "没有找到任何私有头文件引用"
            exit 0
          fi
          
          echo "找到以下私有头文件引用:"
          cat required_headers.txt
          
          # 为每个头文件精确生成函数签名
          while IFS= read -r header; do
            if [ -z "$header" ]; then
              continue
            fi
            
            name=$(basename "$header" .h)
            filepath="Cyanide/tweaks/private/$header"
            
            echo ""
            echo "生成: $header"
            
            # 写入头文件头部
            cat > "$filepath" << 'EOF'
          //
          //  Auto-generated from source code
          //  Cyanide
          //
          
          #import <Foundation/Foundation.h>
          @class RemoteCallSession;
          
          EOF
            
            # 扫描 SettingsViewController.m 中该头文件相关的函数调用
            # 提取函数名和参数，生成精确签名
            grep -E "${name}_[a-z_]+\\(" Cyanide/SettingsViewController.m 2>/dev/null | \
              sed -E 's/.*('${name}'_[a-zA-Z_]+) *\(([^)]*)\).*/FUNC:\1|PARAMS:\2/' | \
              sort -u | \
              while IFS='|' read -r func_part params_part; do
                func_name=$(echo "$func_part" | sed 's/FUNC://')
                params=$(echo "$params_part" | sed 's/PARAMS://')
                
                if [ -z "$func_name" ]; then
                  continue
                fi
                
                # 清理参数
                clean_params=$(echo "$params" | sed -E 's/^[[:space:]]*//;s/[[:space:]]*$//')
                
                if [ -z "$clean_params" ] || [ "$clean_params" = "void" ]; then
                  # 无参数函数
                  echo "static inline bool $func_name(void) { return true; }" >> "$filepath"
                  echo "  📝 $func_name(void)"
                else
                  # 有参数函数：精确推断类型
                  typed_params=""
                  param_names=""
                  IFS=',' read -ra PARTS <<< "$clean_params"
                  for part in "${PARTS[@]}"; do
                    part=$(echo "$part" | sed -E 's/^[[:space:]]*//;s/[[:space:]]*$//')
                    param_names="$param_names $part"
                    
                    # 精确类型推断
                    if [[ "$part" == *"RemoteCallSession"* ]] || [[ "$part" == *"session"* ]]; then
                      if [[ "$part" == *"**"* ]]; then
                        typed_params="${typed_params}RemoteCallSession **, "
                      else
                        typed_params="${typed_params}RemoteCallSession *, "
                      fi
                    elif [[ "$part" == *"BOOL"* ]] || [[ "$part" == *"hasSpringBoard"* ]]; then
                      typed_params="${typed_params}BOOL, "
                    elif [[ "$part" == *"NSString"* ]] || [[ "$part" == *"label"* ]] || [[ "$part" == *"str"* ]]; then
                      typed_params="${typed_params}NSString *, "
                    elif [[ "$part" == "showWifi" ]] || [[ "$part" == "showCell" ]]; then
                      typed_params="${typed_params}bool, "
                    elif [[ "$part" == *"&"* ]] && [[ "$part" == *"mobileSession"* ]]; then
                      typed_params="${typed_params}RemoteCallSession **, "
                    elif [[ "$part" == *"&"* ]]; then
                      typed_params="${typed_params}void **, "
                    elif [[ "$part" =~ ^[0-9]+$ ]]; then
                      typed_params="${typed_params}int, "
                    else
                      typed_params="${typed_params}bool, "
                    fi
                  done
                  # 去掉末尾的逗号和空格
                  typed_params=$(echo "$typed_params" | sed 's/, $//')
                  
                  echo "static inline bool $func_name($typed_params) { return true; }" >> "$filepath"
                  echo "  📝 $func_name($typed_params)"
                fi
              done
            
            # 如果没有找到任何函数，生成默认存根
            if [ ! -s "$filepath" ] || [ $(grep -c "static inline" "$filepath" 2>/dev/null || echo "0") -eq 0 ]; then
              echo "static inline bool ${name}_apply_in_session(void) { return true; }" >> "$filepath"
              echo "static inline bool ${name}_stop_in_session(void) { return true; }" >> "$filepath"
              echo "static inline void ${name}_forget_remote_state(void) {}" >> "$filepath"
              echo "  ⚠️ 未找到函数调用，使用默认存根"
            else
              # 去重
              sort -u "$filepath" > "${filepath}.tmp"
              mv "${filepath}.tmp" "$filepath"
            fi
            
            # 为 typebanner 添加常量
            if [[ "$header" == "typebanner.h" ]]; then
              if ! grep -q "TYPEBANNER_RC_FIRST_EXCEPTION_TIMEOUT_MS" "$filepath"; then
                echo "" >> "$filepath"
                echo "#define TYPEBANNER_RC_FIRST_EXCEPTION_TIMEOUT_MS 3000" >> "$filepath"
                echo "#define TYPEBANNER_RC_MOBILESMS_FIRST_EXCEPTION_TIMEOUT_MS 3000" >> "$filepath"
                echo "  📝 添加 typebanner 常量"
              fi
            fi
            
            echo "  ✅ 完成，共 $(grep -c 'static inline' "$filepath" 2>/dev/null || echo 0) 个函数"
            
          done < required_headers.txt
          
          echo ""
          echo "=== 生成的私有头文件 ==="
          ls -la Cyanide/tweaks/private/
          
          echo ""
          echo "=== rssidisplay.h 内容 ==="
          cat Cyanide/tweaks/private/rssidisplay.h 2>/dev/null || echo "文件不存在"
          
          echo ""
          echo "=== typebanner.h 内容 ==="
          cat Cyanide/tweaks/private/typebanner.h 2>/dev/null || echo "文件不存在"

      - name: 构建 IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: 上传 IPA（供 release 任务使用）
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/Cyanide-*.ipa

  # Release 任务（独立显示）
  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 IPA
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      - name: 获取 IPA 版本和最新 Tag
        id: version
        run: |
          IPA=$(ls build/Cyanide-*.ipa | head -1)
          VERSION=$(echo "$IPA" | sed -E 's/.*Cyanide-([0-9.]+)\.ipa/\1/')
          
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9.]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v${VERSION}"
          fi
          
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: 获取最近 12 小时提交
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="最近 12 小时没有新提交"
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 写入发布说明
        run: |
          cat <<EOF > release_notes.txt
          Cyanide 每日构建 - ${{ steps.version.outputs.tag }}
          
          最近 12 小时提交：
          
          ${COMMITS}
          EOF

      - name: 更新每日构建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          IPA_FILE="${{ steps.version.outputs.ipa }}"
          
          # 清理旧 IPA
          for asset in $(gh release view nightly --json assets -q '.assets[].name | select(contains(".ipa"))' 2>/dev/null); do
            gh release delete-asset nightly "$asset" --yes || true
          done
          
          # 删除本地 nightly tag 避免冲突
          if git rev-parse -q --verify "refs/tags/nightly" >/dev/null; then
            git tag -d nightly
          fi
          
          # 创建或更新 release
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "${TAG_NAME}" \
            --notes "初始每日构建" \
            --draft=false \
            --target main
          
          gh release edit nightly \
            --title "${TAG_NAME}" \
            --notes-file release_notes.txt
          
          gh release upload nightly "$IPA_FILE" --clobber

name: build

on:
  workflow_dispatch:
    inputs:
      sync_upstream_first:
        description: 'Sync upstream tags before build?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-tags:
    if: github.event.inputs.sync_upstream_first == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: add upstream remote
        run: git remote add upstream https://github.com/zeroxjf/cyanide-ios.git

      - name: fetch upstream tags
        run: git fetch upstream --tags

      - name: keep latest 5 version tags + nightly
        run: |
          # 获取上游最新的 5 个正式版本 tags
          git ls-remote --tags upstream | \
            awk -F'/' '{print $3}' | \
            sed 's/\^{}//' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -Vr | \
            head -5 > keep.txt
          
          # 把 nightly 加入保留列表（如果存在）
          if git rev-parse -q --verify "refs/tags/nightly" >/dev/null; then
            echo "nightly" >> keep.txt
          fi
          
          echo "=== Tags to keep ==="
          cat keep.txt
          
          # 删除本地所有不在 keep 列表中的 tags
          for tag in $(git tag); do
            if ! grep -qxF "$tag" keep.txt; then
              echo "Deleting: $tag"
              git tag -d "$tag"
              git push origin --delete "$tag" || true
            fi
          done
          
          # 添加 keep 列表中本地没有的正式版本 tags
          for tag in $(grep -E '^v[0-9]' keep.txt); do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Adding: $tag"
              git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            fi
          done
          
          # 推送所有保留的 tags
          git push origin --tags --force

  build:
    runs-on: macos-latest
    needs: [sync-tags]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: xcodebuild -version

      - name: generate changelog
        run: |
          brew install bash
          chmod +x scripts/gen-changelog.sh
          /opt/homebrew/bin/bash scripts/gen-changelog.sh

      - name: build
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: get IPA version and latest tag
        id: version
        run: |
          IPA=$(ls build/Cyanide-*.ipa | head -1)
          VERSION=$(echo "$IPA" | sed -E 's/.*Cyanide-([0-9.]+)\.ipa/\1/')
          
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9.]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v${VERSION}"
          fi
          
          echo "ipa=$IPA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          echo "Latest tag: $LATEST_TAG"

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          Cyanide nightly build - ${{ steps.version.outputs.tag }}
          
          Last 12 hours commits:
          
          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          IPA_FILE="${{ steps.version.outputs.ipa }}"
          
          # 删除 release 中所有旧的 .ipa 文件
          echo "Cleaning up old IPA assets..."
          for asset in $(gh release view nightly --json assets -q '.assets[].name | select(contains(".ipa"))' 2>/dev/null); do
            echo "Deleting: $asset"
            gh release delete-asset nightly "$asset" --yes || true
          done
          
          # 创建或更新 nightly release
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "${TAG_NAME}" \
            --notes "initial nightly" \
            --draft=false
          
          # 更新 release 信息
          gh release edit nightly \
            --title "${TAG_NAME}" \
            --notes-file release_notes.txt
          
          # 上传新的 IPA
          echo "Uploading: $IPA_FILE"
          gh release upload nightly "$IPA_FILE" --clobber
          
          echo "Done! Only one IPA file is kept."

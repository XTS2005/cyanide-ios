name: Sync Upstream Tags

on:
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: 'Force overwrite local tags (use with caution)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/zeroxjf/cyanide-ios.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Get local and upstream tags
        run: |
          # 获取本地已有的 tags
          git tag > local_tags.txt
          
          # 获取上游所有的 tags
          git ls-remote --tags upstream | awk -F'/' '{print $3}' | sed 's/\^{}//' | grep -v '^$' > upstream_tags.txt
          
          # 找出本地没有的 tags（新 tags）
          comm -23 <(sort upstream_tags.txt) <(sort local_tags.txt) > new_tags.txt
          
          # 找出已经存在的 tags（重复的）
          comm -12 <(sort upstream_tags.txt) <(sort local_tags.txt) > duplicate_tags.txt
          
          echo "=== Tag Statistics ==="
          echo "Upstream tags total: $(cat upstream_tags.txt | wc -l)"
          echo "Local tags total: $(cat local_tags.txt | wc -l)"
          echo "New tags to add: $(cat new_tags.txt | wc -l)"
          echo "Duplicate tags (skipped): $(cat duplicate_tags.txt | wc -l)"

      - name: Show duplicate tags (for inspection)
        if: ${{ github.event.inputs.force_overwrite != 'true' }}
        run: |
          if [ -s duplicate_tags.txt ]; then
            echo "=== Duplicate tags (will be skipped) ==="
            head -20 duplicate_tags.txt
            if [ $(cat duplicate_tags.txt | wc -l) -gt 20 ]; then
              echo "... and $(($(cat duplicate_tags.txt | wc -l) - 20)) more"
            fi
          else
            echo "No duplicate tags found"
          fi

      - name: Add only new tags (skip duplicates)
        if: ${{ github.event.inputs.force_overwrite != 'true' }}
        run: |
          if [ ! -s new_tags.txt ]; then
            echo "No new tags to add"
            exit 0
          fi
          
          echo "Adding new tags..."
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "  Adding tag: $tag"
              git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            fi
          done < new_tags.txt
          
          echo "Pushing new tags to origin..."
          git push origin --tags

      - name: Force overwrite all tags (if requested)
        if: ${{ github.event.inputs.force_overwrite == 'true' }}
        run: |
          echo "⚠️ Force overwriting all tags from upstream"
          # 删除所有本地 tags
          git tag -l | xargs -r git tag -d
          # 重新拉取上游所有 tags
          git fetch upstream --tags
          # 强制推送所有 tags 到 origin
          git push origin --tags --force
          echo "✅ All tags synced with force overwrite"

      - name: Show sync summary
        run: |
          echo "=== Sync Summary ==="
          echo "Final local tags: $(git tag | wc -l)"
          echo ""
          echo "Latest 10 tags:"
          git tag --sort=-v:refname | head -10

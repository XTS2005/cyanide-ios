name: Sync Upstream (Tags & Code)

on:
  # 手动触发
  workflow_dispatch:
  # 每天 UTC 0 点自动运行
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/zeroxjf/cyanide-ios.git

      - name: Fetch upstream (code + tags)
        run: |
          git fetch upstream --tags
          git fetch upstream main

      - name: Sync tags to your fork
        run: git push origin --tags

      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories --no-edit || true

      - name: Push merged changes
        run: git push origin main

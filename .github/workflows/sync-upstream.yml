name: Sync Upstream Tags (Keep Latest 5 + Nightly)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/zeroxjf/cyanide-ios.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Keep latest 5 version tags + nightly, delete others
        run: |
          # 获取上游最新的 5 个正式版本 tags（v1.2.3 格式）
          git ls-remote --tags upstream | \
            awk -F'/' '{print $3}' | \
            sed 's/\^{}//' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -Vr | \
            head -5 > keep.txt
          
          # 把 nightly 加入保留列表（如果存在）
          if git rev-parse -q --verify "refs/tags/nightly" >/dev/null; then
            echo "nightly" >> keep.txt
          fi
          
          echo "=== Tags to keep ==="
          cat keep.txt
          
          # 删除本地所有不在 keep 列表中的 tags
          for tag in $(git tag); do
            if ! grep -qxF "$tag" keep.txt; then
              echo "Deleting: $tag"
              git tag -d "$tag"
              git push origin --delete "$tag" || true
            fi
          done
          
          # 添加 keep 列表中本地没有的正式版本 tags
          for tag in $(grep -E '^v[0-9]' keep.txt); do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Adding: $tag"
              git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            fi
          done
          
          # 推送所有保留的 tags
          git push origin --tags --force

      - name: Show final tags
        run: |
          echo "=== Final tags ==="
          git tag --sort=-v:refname
          echo ""
          echo "Total tags: $(git tag | wc -l)"
